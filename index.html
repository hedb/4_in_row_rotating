<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Four-in-a-Row with Rotating Grid</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
</head>
<body>
    <h1>Four in a row (wait, what?)</h1>

    <div id="game-container">
        <div class="top-bar">
            <div class="control-group">
                <label for="countdown">Turns until next rotation:</label>
                <span id="countdown"></span>
            </div>
            <div id="settings-icon">⚙️</div>
        </div>

        <div id="turn-indicator">Player 1's turn</div>

        <div id="grid-wrapper">
            <div id="grid"></div>
        </div>

    </div>

    <div id="settings-pane" class="hidden">
        <div id="settings-content">
            <h2>Settings</h2>
            <div class="control-group">
                <label for="rotationFrequency">Rotation Frequency:</label>
                <select id="rotationFrequency">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3"  selected>3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                </select>
            </div>
            <div class="settings-actions">
                <button id="rotate-button">Rotate Grid</button>
                <button id="reset-button">Reset Game</button>
            </div>
            <button id="close-settings">Close</button>
            <div id="version-display" class="version"></div>
        </div>
    </div>
    <div id="overlay" class="hidden"></div>

    <script type="module" src="index.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js', { type: 'module' })
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(error => {
                        console.log('ServiceWorker registration failed: ', error);
                    });
            });
        }
    </script>
</body>
</html>
