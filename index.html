<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Four-in-a-Row with Rotating Grid</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">

    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-LV2J2F8N4S"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('js', new Date());
  // Default GA4 page_view
  gtag('config', 'G-LV2J2F8N4S');
</script>


</head>
<body>
    <div style="margin-bottom: 20px; text-align:center;">
        <img id="hero-logo" class="hero-logo grid-easter-egg" src="icons/icon-512.png" alt="Four-in-a-Row with Rotating Grid" />
    </div>

    <!-- Mode Selection Screen -->
    <div id="mode-selection" class="mode-selection">
        <h2>Choose Game Mode</h2>

        <!-- General color setting -->
        <div class="color-setting">
            <span class="color-label">Your color:</span>
            <label class="color-radio"><input type="radio" name="player-color" id="color-white" value="white" checked> White</label>
            <label class="color-radio"><input type="radio" name="player-color" id="color-black" value="black"> Black</label>
        </div>

        <!-- AI Mode block: difficulty buttons -->
        <div class="ai-mode-block">
            <div class="ai-title">Play vs. Computer</div>
            <div class="ai-difficulty">
                <button id="play-ai-normal-btn" class="mode-button ai-diff-btn">Normal</button>
                <button id="play-ai-hard-btn" class="mode-button ai-diff-btn">Hard</button>
                <button id="play-ai-ouch-btn" class="mode-button ai-diff-btn">Ouch</button>
            </div>
        </div>

        <div class="mode-buttons">
            <button id="play-online-btn" class="mode-button">
                <span class="mode-title">Play Online</span>
                <span class="mode-description">Play with someone remotely</span>
            </button>
            <button id="play-local-btn" class="mode-button">
                <span class="mode-title">Play Local</span>
                <span class="mode-description">Two players on this device</span>
            </button>
        </div>
    </div>

    <!-- Waiting Room for Online Games -->
    <div id="waiting-room" class="waiting-room hidden">
        <div class="waiting-content">
            <h2>Online Game</h2>
            <div id="waiting-status" class="waiting-status">Creating game...</div>
            
            <div id="waiting-spinner" class="spinner">
                <div class="spinner-inner"></div>
            </div>
            
            <div id="sharing-section" class="sharing-section hidden">
                <p>Share this link with your opponent:</p>
                <div class="link-container">
                    <input type="text" id="guest-link" class="guest-link-input" readonly>
                    <button id="copy-link-btn" class="copy-btn">Copy Link</button>
                </div>
                <div id="copy-feedback" class="copy-feedback hidden">Link copied! 📋</div>
            </div>
            
            <button id="cancel-waiting-btn" class="cancel-btn">Cancel</button>
        </div>
    </div>

    <div id="game-container" class="hidden">
        <div class="top-bar">
            <!-- Game over layout (hidden during play) -->
            <div id="top-left-actions" class="top-left-actions hidden">
                <button id="analyze-btn" class="game-over-btn">Analyze Game</button>
                <button id="new-game-btn" class="game-over-btn">New Game</button>
            </div>
            <div id="top-center-display" class="top-center-display"></div>
            
            <!-- Gameplay layout (visible during play) -->
            <div id="gameplay-status" class="gameplay-status">
                <div id="turn-indicator">White's turn</div>
                <div class="rotation-info">
                    <label>Turns until rotation:</label>
                    <span id="countdown"></span>
                </div>
            </div>
        </div>
        
        <div id="game-over-container" class="game-over-container hidden">
            <span id="game-over-text"></span>
        </div>


        <div id="grid-wrapper">
            <div id="grid"></div>
        </div>

        <!-- Replay Controls -->
        <div id="replay-controls" class="replay-controls hidden">
            <div class="replay-info">
                <span id="replay-step-info">Step 1, White turn</span>
            </div>
            <div class="replay-buttons">
                <button id="replay-prev-btn" class="replay-btn" title="Previous step">
                    <span class="replay-icon">⏮</span>
                </button>
                <button id="replay-next-btn" class="replay-btn" title="Next step">
                    <span class="replay-icon">⏭</span>
                </button>
            </div>
            <div class="replay-actions">
                <button id="exit-replay-btn" class="exit-replay-btn">Exit Replay</button>
            </div>
        </div>

    </div>

    <!-- Settings Modal (moved outside game-container to ensure visibility on all screens) -->
    <div id="settings-modal" class="settings-modal hidden">
        <div class="settings-content">
            <div class="settings-header">
                <h3>Settings</h3>
                <button id="close-settings-btn" class="close-btn">×</button>
            </div>
            <div class="settings-body">
                <div class="setting-item">
                    <label>Version:</label>
                    <span id="version-display"></span>
                </div>
                <div class="setting-item">
                    <label>Debug Logs:</label>
                    <div class="log-controls">
                        <button id="copy-logs-btn" class="copy-logs-btn">Copy Logs</button>
                        <button id="clear-logs-btn" class="clear-logs-btn">Clear</button>
                    </div>
                </div>
                <div class="setting-item">
                    <div id="log-stats" class="log-stats"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="settings-pane" class="hidden">
        <div id="settings-content">
            <h2>Settings</h2>
            <div class="control-group">
                <label for="rotationFrequency">Rotation Frequency:</label>
                <select id="rotationFrequency">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3"  selected>3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                </select>
            </div>
            <div class="settings-actions">
                <button id="rotate-button">Rotate Grid</button>
                <button id="reset-button">Reset Game</button>
            </div>
            <button id="close-settings">Close</button>
            <div id="version-display" class="version"></div>
        </div>
    </div>
    <div id="overlay" class="hidden"></div>

    <script type="module" src="index.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(error => {
                        console.log('ServiceWorker registration failed: ', error);
                    });
            });
        }
    </script>
</body>
</html>
